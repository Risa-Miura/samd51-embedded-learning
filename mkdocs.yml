site_name: SAMD51 Embedded Systems Learning Journal
site_description: An engineering notebook for learning ARM Cortex-M4 firmware on the Adafruit Grand Central M4 Express.
site_url: https://risa-miura.github.io/samd51-embedded-learning/
repo_url: https://github.com/Risa-Miura/samd51-embedded-learning
repo_name: Risa-Miura/samd51-embedded-learning
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  language: en
  logo: assets/images/chip.svg
  favicon: assets/images/chip.svg
  font: false
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Start here:
      - Local setup: getting-started.md
      - Learning roadmap: learning-roadmap.md
      - Writing notes: contributing.md
      - Publishing: publishing.md
      - Validation & status: validation.md
  - Microchip University:
      - microchip-university/index.md
      - 01 · MCU basics: microchip-university/01-microcontroller-basics.md
      - 02 · Clock system: microchip-university/02-clock-system.md
      - 03 · GPIO: microchip-university/03-gpio.md
      - 04 · Timers: microchip-university/04-timers.md
      - 05 · Interrupts: microchip-university/05-interrupts.md
      - 06 · DMA: microchip-university/06-dma.md
      - 07 · ADC: microchip-university/07-adc.md
      - 08 · Event System: microchip-university/08-event-system.md
      - Adapted workbench labs:
          - Start here: microchip-university/labs/index.md
          - Compatibility report: microchip-university/labs/compatibility.md
          - Manual reading map: microchip-university/labs/manual-reading-map.md
          - Workbench setup: microchip-university/labs/workbench-setup.md
          - Lab 1 · GPIO and timers: microchip-university/labs/lab-1-gpio-timers.md
          - Lab 2 · RTC: microchip-university/labs/lab-2-rtc.md
          - Lab 3 · Peripheral DMA: microchip-university/labs/lab-3-dma.md
          - Lab 4 · Event System: microchip-university/labs/lab-4-event-system.md
          - Lab 5 · Memory DMA: microchip-university/labs/lab-5-memory-dma.md
          - Verification checklist: microchip-university/labs/verification.md
  - Workbench hardware:
      - Grand Central M4: hardware/grand-central-m4.md
      - Wiring and equipment: hardware/wiring-reference.md
      - Atmel-ICE: hardware/atmel-ice.md
      - Analog Discovery 2: hardware/analog-discovery-2.md
  - Projects:
      - projects/index.md
      - 01 · LED blink: projects/led-blink.md
      - 02 · Timer interrupt: projects/timer-interrupt.md
      - 03 · ADC sampling: projects/adc-sampling.md
      - 04 · DMA benchmark: projects/dma-benchmark.md
  - Reference:
      - SAMD51 & board: reference/samd51.md
      - Embedded C: reference/embedded-c.md
      - Resources: reference/resources.md
