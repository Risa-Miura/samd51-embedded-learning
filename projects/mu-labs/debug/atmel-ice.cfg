# OpenOCD 0.12.x. Vendor target file explicitly supports SAM D51/E51/E53/E54.
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/atsame5x.cfg]
# Keep this conservative for first connection with the stock ribbon cable.
adapter speed 500
# Uses SYSRESETREQ by default. The nRESET wire is still connected for recovery.
# If several CMSIS-DAP probes are attached, add: adapter serial <your ICE serial>

proc check_grand_central_target {} {
    set did [lindex [read_memory 0x41002018 32 1] 0]
    set mask [expr {(0xf << 28) | (0x1f << 23) | (0x3f << 16) | 0xff}]
    set expected [expr {(6 << 28) | (0 << 23) | (6 << 16) | 0}]
    if {($did & $mask) != $expected} {
        error "DSU DID does not identify ATSAMD51P20A; stop and verify the target"
    }
    set user0 [lindex [read_memory 0x00804000 32 1] 0]
    set protected [expr {(15 - (($user0 >> 26) & 15)) * 8192}]
    if {$protected > 16384} {
        error "BOOTPROT extends beyond 0x4000; stop without changing fuses"
    }
    echo "ATSAMD51P20A identity checked; boot-protected bytes: $protected"
}
